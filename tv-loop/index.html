<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Belz TV Loop</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{display:flex;align-items:center;justify-content:center}
video{width:100vw;height:100vh;object-fit:contain;background:#000;display:block}
</style>
</head>
<body>
<video id="tv" autoplay muted loop playsinline webkit-playsinline preload="auto"></video>
<script>
(async()=>{
  const v=document.getElementById('tv');
  const files=Array.from({length:11},(_,i)=>`chunk${String(i+1).padStart(2,'0')}.txt`);
  try{
    const parts=[];
    for(const f of files){
      const r=await fetch(f,{cache:'force-cache'});
      if(!r.ok) throw new Error(`${f}: ${r.status}`);
      parts.push((await r.text()).trim());
    }
    const bin=atob(parts.join(''));
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    v.src=URL.createObjectURL(new Blob([bytes],{type:'video/mp4'}));
    v.muted=true;
    v.loop=true;
    v.load();
    await v.play().catch(()=>{});
  }catch(e){
    document.body.innerHTML='<div style="color:white;font:24px Arial;text-align:center;padding:30px">Erro ao carregar o vídeo.<br>Atualize a página.</div>';
  }
})();
const play=()=>{const v=document.getElementById('tv'); if(v) v.play().catch(()=>{});};
document.addEventListener('click',play);
document.addEventListener('touchstart',play,{passive:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden) play();});
</script>
</body>
</html>
